name: Refresh fusion headlines and papers
on:
  schedule:
    # Twice each day, UTC. Scheduled workflows may run later during busy periods.
    - cron: '17 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch research and news
        run: python update_feed.py
      - name: Save changes to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh fusion news and papers"
            git push
          fi
